# 地图区域定义 (Zone Configuration)
# 坐标系: map 帧 (与 nav2 / dog_map 一致)
# 每个区域可定义任务属性, 由 zone_manager 发布给决策层行为树

zones:
  # ---------------- 狗洞区 ----------------
  # 狗洞实测位置(focus camera 四点):
  #   (7.63,6.53), (7.63,5.74), (8.94,6.53), (8.94,5.71)
  #   => 洞口中心 (8.285, 6.12), 洞宽 ~0.82m (y 向), 穿洞方向沿 x 轴
  #   双向都可能穿: 从 x<8.285 进 -> 面向 +x (yaw=0)
  #                  从 x>8.285 进 -> 面向 -x (yaw=pi)
  - name: "dog_hole"
    shape: rectangle
    center: [8.285, 6.12]
    size: [2.6, 1.4]        # [沿穿洞方向(x), 垂直方向(y)] 覆盖洞口两侧进入区
    yaw: 0.0                # 区域朝向(穿洞方向沿 +x)
    tasks:
      spin: false           # 1. 不小陀螺
      face_hole: true       # 2. 正对洞口 (nav_yaw 由 zone_manager 按机器人位置自动选 0 或 pi)
      nav_yaw: 0.0          #    仅作为默认; face_hole=true 时自动判断双向
      bidirectional: true   #    支持双向穿洞: 自动选 0 或 pi
      speed_limit: 0.5      # 3. 过洞限速 (m/s), 可选

  # ---------------- 示例:大路区(正常陀螺) ----------------
